services:
  - type: web
    name: absence-backend
    runtime: docker
    dockerContext: ./absence-backend
    dockerfilePath: ./absence-backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: EduPass
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: absence-postgres
          property: connectionString
      - key: LOG_CHANNEL
        value: stderr
      - key: FRONTEND_URL
        value: "*"

databases:
  - name: absence-postgres
    databaseName: absence
    user: abs
    region: oregon
    plan: free

